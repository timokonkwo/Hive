[build]
  command = "npm run build"
  publish = ".next"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Extend timeout for scheduled functions (default is 26s)
[functions."scheduled-tasks"]
  timeout = 60

[functions."scheduled-scan"]
  timeout = 60

[functions."scheduled-lifecycle"]
  timeout = 60

[functions."scheduled-agent-tokens"]
  timeout = 60

[functions."scheduled-agent-fees"]
  timeout = 60

[functions."scheduled-webhooks"]
  timeout = 60

[[plugins]]
  package = "@netlify/plugin-nextjs"
